<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>복지 AI 앱스페이스 | 복지인사이트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --wall-1:#DDE2CB; --wall-2:#C7CFAE; --wall-3:#EEF0E2;
  --ink:#20241A; --muted:#545A47; --label:#20241A;
  --glass:rgba(255,255,255,.55); --glass-line:rgba(255,255,255,.7);
  --sheet:#FBFBF6; --sheet-line:#DCDFCF; --chip:rgba(255,255,255,.6);
  --btn-bg:#2E3220; --btn-fg:#F4ECD3; --badge:#D9412B; --focus:#D9412B;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --wall-1:#1C2014; --wall-2:#2B3220; --wall-3:#12140D;
    --ink:#EFEDDC; --muted:#AEB29C; --label:#EFEDDC;
    --glass:rgba(40,45,30,.55); --glass-line:rgba(255,255,255,.12);
    --sheet:#1E2116; --sheet-line:#353A29; --chip:rgba(255,255,255,.1);
    --btn-bg:#D7DCAE; --btn-fg:#1A1D10; --badge:#E8573E; --focus:#F08A6E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --wall-1:#1C2014; --wall-2:#2B3220; --wall-3:#12140D;
  --ink:#EFEDDC; --muted:#AEB29C; --label:#EFEDDC;
  --glass:rgba(40,45,30,.55); --glass-line:rgba(255,255,255,.12);
  --sheet:#1E2116; --sheet-line:#353A29; --chip:rgba(255,255,255,.1);
  --btn-bg:#D7DCAE; --btn-fg:#1A1D10; --badge:#E8573E; --focus:#F08A6E;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{min-height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;min-height:100vh;color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.5;
  background:
    radial-gradient(120% 60% at 0% 0%, var(--wall-2) 0%, transparent 60%),
    radial-gradient(90% 50% at 100% 100%, var(--wall-2) 0%, transparent 65%),
    linear-gradient(180deg, var(--wall-1), var(--wall-3));
  background-attachment:fixed;
  padding-bottom:120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--wall-1)}
.screen{max-width:760px;margin:0 auto;padding:18px 18px 0}

/* widget */
.widget{display:flex;gap:16px;align-items:center;background:var(--glass);border:1px solid var(--glass-line);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:26px;padding:18px}
.widget .logo{width:72px;height:72px;border-radius:18px;flex:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.widget h1{margin:0;font-size:22px;letter-spacing:-0.02em;line-height:1.25}
.widget .sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.widget .count{font-weight:700;color:var(--ink)}
.privacy{margin-top:10px;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.privacy svg{flex:none}

/* controls */
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;padding:12px 0 10px;margin-top:6px}
.controls::before{content:"";position:absolute;inset:0 -18px;background:linear-gradient(var(--wall-1) 70%,transparent);z-index:-1}
.spot{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--glass-line);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:14px;padding:0 12px}
.spot input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:11px 0;outline:none}
.spot:focus-within{outline:2px solid var(--focus);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center;margin-top:10px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:13.5px;font-weight:500;border:0;border-radius:999px;padding:7px 13px;
  background:var(--chip);color:var(--ink);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg)}
.seg{flex:none;display:flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{font:inherit;font-size:13px;font-weight:500;border:0;background:transparent;color:var(--muted);
  padding:5px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}

/* folders + icons */
.folder{margin-top:22px}
.folder h2{margin:0 0 12px 4px;font-size:15px;font-weight:700;display:flex;gap:8px;align-items:baseline}
.folder h2 span{font-weight:400;color:var(--muted);font-size:13px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px}
@media (min-width:560px){.apps{grid-template-columns:repeat(6,1fr)}}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:var(--label);
  -webkit-tap-highlight-color:transparent;border-radius:16px;padding:2px}
.app:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.ico{position:relative;width:100%;max-width:68px;aspect-ratio:1/1;border-radius:23%;
  background:linear-gradient(145deg,var(--g1),var(--g2));
  box-shadow:0 4px 12px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.25);
  display:grid;place-items:center;transition:transform .12s ease}
.app:active .ico{transform:scale(.92)}
.mono{color:#F6EED6;font-weight:700;letter-spacing:-0.03em;line-height:1;font-size:var(--fs,24px)}
.badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;
  background:var(--badge);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;
  border:2px solid var(--wall-1);font-variant-numeric:tabular-nums}
.lbl{font-size:12.5px;font-weight:500;text-align:center;line-height:1.25;max-width:84px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.empty{text-align:center;color:var(--muted);padding:50px 0}
.empty button{margin-top:10px;font:inherit;border:0;border-radius:999px;padding:8px 16px;background:var(--btn-bg);color:var(--btn-fg);cursor:pointer}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:7;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 12px)}
.dock-in{max-width:420px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-radius:28px;padding:12px 14px}
.dock .lbl{display:none}
.dock .ico{max-width:58px}

footer{margin:40px 0 0;text-align:center;font-size:12.5px;color:var(--muted)}
footer a{color:inherit}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:520px;margin:0 auto;background:var(--sheet);
  border-radius:24px 24px 0 0;border:1px solid var(--sheet-line);border-bottom:0;
  padding:10px 22px calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateY(105%);transition:transform .25s ease}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--sheet-line);margin:0 auto 16px}
.sh-top{display:flex;gap:14px;align-items:center}
.sh-top .ico{width:64px;max-width:64px;flex:none}
.sh-top .badge{display:none}
.sh-top h3{margin:0;font-size:21px;letter-spacing:-0.02em}
.sh-top p{margin:2px 0 0;color:var(--muted);font-size:14px}
.sh-desc{margin:16px 0 10px;font-size:15.5px}
.sh-use{margin:0;font-size:14.5px;background:var(--chip);border-radius:12px;padding:10px 12px}
.sh-use b{display:block;font-size:13px;color:var(--muted);font-weight:500}
.sh-tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 18px}
.sh-tags span{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted)}
.open{display:flex;justify-content:center;align-items:center;gap:8px;text-decoration:none;background:var(--btn-bg);color:var(--btn-fg);
  border-radius:14px;padding:14px;font-weight:700;font-size:17px}
.open:focus-visible,.chip:focus-visible,.seg button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.ico,.sheet,.scrim{transition:none}}
</style>
</head>

  {c:"apikey",n:"Claude 결제",m:"Cl결제",u:"https://console.anthropic.com/settings/billing",d:"Anthropic API 크레딧 충전과 결제 정보 화면입니다.",x:"API 사용 전 크레딧 충전, 사용량 확인",t:["결제·크레딧"]},
  {c:"apikey",n:"Gemini 키",m:"Ge키",u:"https://aistudio.google.com/apikey",d:"Gemini(구글) API 키를 만드는 곳. 환경변수 이름은 보통 GEMINI_API_KEY입니다. 키는 비밀번호처럼 다루고 공유하지 마세요.",x:"무료 사용량으로 웹앱에 Gemini 연결해 보기",t:["GEMINI_API_KEY","무료 사용량"]}
];
APPS.forEach((a,i)=>a.no=i+1);
const DOCK = ["ChatGPT","Gemini","Claude","클로바노트"];
const catOf = id => CATS.find(c=>c.id===id);
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const fs = m => m.length>=3 ? "17px" : (/[가-힣]/.test(m) ? "21px" : "24px");

let current="all", mode="open";
try{ const s=localStorage.getItem("aispace-mode"); if(s==="info"||s==="open") mode=s; }catch(e){}

const $ = id => document.getElementById(id);
const icon = a => {const g=catOf(a.c).g;
  return `<span class="ico" style="--g1:${g[0]};--g2:${g[1]}"><span class="mono" style="--fs:${fs(a.m)}">${esc(a.m)}</span><span class="badge">${a.no}</span></span>`;};
const tile = a => `<a class="app" href="${a.u}" target="_blank" rel="noopener noreferrer" data-no="${a.no}" aria-label="${a.no}번 ${esc(a.n)}">${icon(a)}<span class="lbl">${esc(a.n)}</span></a>`;

function renderChips(){
  const all=[{id:"all",name:"전체"},{id:"hot",name:"많이 쓰는 앱"},...CATS];
  $("chips").innerHTML = all.map(c=>`<button class="chip" data-id="${c.id}" aria-pressed="${c.id===current}">${c.name}</button>`).join("");
}
function render(){
  const term=$("q").value.trim().toLowerCase();
  const cats=(current==="all"||current==="hot")?CATS:CATS.filter(c=>c.id===current);
  let html="";
  for(const cat of cats){
    const apps=APPS.filter(a=>a.c===cat.id&&(current!=="hot"||a.hot)&&
      (!term||(a.n+" "+a.m+" "+a.d+" "+a.x+" "+a.t.join(" ")+" "+cat.name).toLowerCase().includes(term)));
    if(!apps.length) continue;
    html+=`<section class="folder"><h2>${cat.name}<span>${apps.length}개</span></h2><div class="apps">${apps.map(tile).join("")}</div></section>`;
  }
  $("home").innerHTML = html || `<div class="empty">찾는 앱이 없습니다. 다른 단어로 검색해 보세요.<br><button id="reset">전체 보기</button></div>`;
  const r=$("reset"); if(r) r.onclick=()=>{$("q").value="";current="all";renderChips();render();};
}
function renderDock(){ $("dock").innerHTML = DOCK.map(n=>tile(APPS.find(a=>a.n===n))).join(""); }
function renderMode(){
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.mode===mode));
}

let lastFocus=null;
function openSheet(a){
  lastFocus=document.activeElement;
  const g=catOf(a.c).g, ico=$("sh-ico");
  ico.style.setProperty("--g1",g[0]); ico.style.setProperty("--g2",g[1]);
  ico.innerHTML=`<span class="mono" style="--fs:${fs(a.m)}">${esc(a.m)}</span>`;
  $("sh-name").textContent=a.name||a.n;
  $("sh-meta").textContent=`${a.no}번 · ${catOf(a.c).name}`;
  $("sh-desc").textContent=a.d;
  $("sh-use").textContent=a.x;
  $("sh-tags").innerHTML=(a.hot?["많이 씀"]:[]).concat(a.t).map(t=>`<span>${t}</span>`).join("");
  const o=$("sh-open"); o.href=a.u; o.textContent=`${a.n} 열기`;
  $("scrim").classList.add("on"); $("sheet").classList.add("on"); $("sheet").setAttribute("aria-hidden","false");
  o.focus();
}
function closeSheet(){
  $("scrim").classList.remove("on"); $("sheet").classList.remove("on"); $("sheet").setAttribute("aria-hidden","true");
  if(lastFocus) lastFocus.focus();
}

document.addEventListener("click",e=>{
  const app=e.target.closest(".app");
  if(app && mode==="info"){ e.preventDefault(); openSheet(APPS[+app.dataset.no-1]); return; }
  const chip=e.target.closest(".chip");
  if(chip){ current=chip.dataset.id; renderChips(); render();
    const c=document.querySelector(".controls"); window.scrollTo({top:$("home").getBoundingClientRect().top+window.scrollY-c.offsetHeight-6}); }
  const seg=e.target.closest(".seg button");
  if(seg){ mode=seg.dataset.mode; renderMode(); try{localStorage.setItem("aispace-mode",mode);}catch(err){} }
});
$("scrim").onclick=closeSheet;
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
$("q").addEventListener("input",render);

$("total").textContent=APPS.length+"개";
renderChips(); renderMode(); render(); renderDock();
</script>
